{% set name = "av" %}
{% set version = "19.0.1" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 08674930eaf1af78a3ed8f93d3ba49383323b3a867e84349d9c399e36f7497da
  patches:
    # Convert test h264 references to openh264 (works with both GPL and LGPL ffmpeg)
    - patches/0001-Convert-h264-tests-to-openh264-for-lgpl-build.patch
    # Upstream ships abi3 wheels for 3.12/3.13; disable Py_LIMITED_API so each version builds separately
    - patches/0002-Disable-cp111-abi.patch

build:
  number: 0
  # Upstream requires-python >=3.12 (19.0.0 dropped 3.11); we disable Py_LIMITED_API so each version builds separately
  skip: true  # [py<312]
  script:
    - {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  run_exports:
    # PyAV follows semantic versioning
    - {{ pin_subpackage('av') }}

requirements:
  build:
    - {{ compiler('c') }}
    - pkg-config  # [not win]
  host:
    - python
    - pip
    - setuptools >=78.0    # https://github.com/PyAV-Org/PyAV/blob/v19.0.1/pyproject.toml#L2
    - cython >=3.3.0,<4    # https://github.com/PyAV-Org/PyAV/blob/v19.0.1/pyproject.toml#L2
    - numpy
    - ffmpeg {{ ffmpeg }}
  run:
    - python
    # No upstream runtime deps; pillow and numpy are optional but needed for
    # common workflows (image conversion, array-based frame access). Conda-forge
    # also promotes them to required.
    - pillow
    - numpy >=1.22

test:
  imports:
    - av
    - av.audio
    - av.audio.fifo
    - av.video
  requires:
    - pip
  commands:
    - pip check
    - python -c "import av; print('FFmpeg version:', av.library_versions)"

about:
  home: https://github.com/PyAV-Org/PyAV/
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE.txt
  summary: Pythonic bindings for FFmpeg's libraries.
  description: |
    PyAV is a Pythonic binding for FFmpeg or Libav. We aim to provide all of
    the power and control of the underlying library, but manage the gritty
    details as much as possible.
  doc_url: https://pyav.org/docs/develop
  dev_url: https://github.com/PyAV-Org/PyAV/

extra:
  recipe-maintainers:
    - danielballan
    - mikeboers
    - sdvillal
    - h-vetinari
    - hmaarrfk
    - xkong-anaconda
