{% set name = "av" %}
{% set version = "16.0.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: c275830f9ad575a2da941177b81d11b442271d205ddb5cd27fa82930aa69b38e
  patches:
    # Convert test h264 references to openh264 (works with both GPL and LGPL ffmpeg)
    - patches/0001-Convert-h264-tests-to-openh264-for-lgpl-build.patch

build:
  number: 0
  # Upstream requires >=3.11
  skip: true  # [py<310]
  script:
    - {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  run_exports:
    # PyAV follows semantic versioning
    - {{ pin_subpackage('av') }}

requirements:
  build:
    - {{ compiler('c') }}
    - pkg-config  # [not win]
  host:
    - python
    - pip
    - setuptools >=77.0    # https://github.com/PyAV-Org/PyAV/blob/v16.1.0/pyproject.toml#L2
    - cython >=3.1.0,<4.0  # https://github.com/PyAV-Org/PyAV/blob/v16.1.0/pyproject.toml#L3
    - numpy {{ numpy }}
    - ffmpeg {{ ffmpeg }}
  run:
    - python
    # No upstream runtime deps; pillow and numpy are optional but needed for
    # common workflows (image conversion, array-based frame access). Conda-forge
    # also promotes them to required.
    - pillow
    - numpy >=1.22

test:
  imports:
    - av
    - av.audio
    - av.audio.fifo
    - av.video
  requires:
    - pip
  commands:
    - pip check
    - python -c "import av; print('FFmpeg version:', av.library_versions)"

about:
  home: https://pyav.basswood-io.com
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE.txt
  summary: Pythonic bindings for FFmpeg.
  description: |
    PyAV is a Pythonic binding for FFmpeg or Libav. We aim to provide all of
    the power and control of the underlying library, but manage the gritty
    details as much as possible.
  doc_url: https://pyav.basswood-io.com
  dev_url: https://github.com/PyAV-Org/PyAV/

extra:
  recipe-maintainers:
    - danielballan
    - mikeboers
    - sdvillal
    - h-vetinari
    - hmaarrfk
    - xkong-anaconda
